<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PATOWARI'S HACK - DK WIN</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&family=Poppins:wght@400;600;700&family=Rubik:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  body, html {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #161e26;
    font-family: 'Poppins', sans-serif;
  }

  #game-frame {
    width: 100%;
    height: 100%;
    border: none;
    position: fixed;
    top: 0;
    left: 0;
    z-index: 1;
  }

  @keyframes rgbFlow {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  @keyframes rgbGlow {
    0% { box-shadow: 0 0 14px rgba(255, 0, 128, 0.55), 0 0 24px rgba(0, 212, 255, 0.25); }
    33% { box-shadow: 0 0 14px rgba(0, 255, 136, 0.55), 0 0 24px rgba(255, 0, 200, 0.25); }
    66% { box-shadow: 0 0 14px rgba(0, 150, 255, 0.55), 0 0 24px rgba(255, 180, 0, 0.25); }
    100% { box-shadow: 0 0 14px rgba(255, 0, 128, 0.55), 0 0 24px rgba(0, 212, 255, 0.25); }
  }

  /* Main 220px Floating Overlay */
  #predictor-wrapper {
    position: fixed;
    top: 115px;
    left: 16px;
    width: 220px;
    z-index: 9999;
    touch-action: none;
  }

  .rgb-border-box {
    position: relative;
    padding: 2.2px;
    border-radius: 13px;
    background: linear-gradient(135deg, #ff2a85, #ff6a00, #ffd000, #00e676, #00b0ff, #aa00ff, #ff2a85);
    background-size: 350% 350%;
    animation: rgbFlow 4s ease infinite, rgbGlow 4s ease infinite;
  }

  .panel-inner {
    background: #141218;
    border-radius: 11px;
    padding: 5px 7px 6px 7px;
    color: #fff;
    position: relative;
    overflow: hidden;
  }

  /* Top & Bottom Ticker Bar */
  .ticker-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: 'Orbitron', sans-serif;
    font-size: 6.5px;
    font-weight: 800;
    color: #00e676;
    letter-spacing: 0.6px;
    padding: 1px 2px;
  }

  /* Header Bar */
  .header-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #1c1922;
    border: 1px solid #2c2736;
    border-radius: 7px;
    padding: 4px 7px;
    margin: 2px 0 5px 0;
    cursor: grab;
  }

  .header-bar:active {
    cursor: grabbing;
  }

  .header-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 9.5px;
    font-weight: 900;
    letter-spacing: 0.4px;
    background: linear-gradient(90deg, #ff4d8d, #ff9e44, #00e676, #4dd0e1);
    background-size: 300% 300%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: rgbFlow 3s ease infinite;
  }

  .close-btn {
    width: 15px;
    height: 15px;
    border-radius: 4px;
    background: rgba(0, 230, 118, 0.1);
    border: 1px solid rgba(0, 230, 118, 0.45);
    color: #00e676;
    font-size: 8.5px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    line-height: 1;
  }

  /* Login Section */
  #login-view {
    padding: 8px 4px;
    text-align: center;
  }

  .login-avatar {
    width: 42px;
    height: 42px;
    border-radius: 8px;
    object-fit: cover;
    border: 1.5px solid #ff4d8d;
    margin: 0 auto 5px auto;
    display: block;
  }

  .login-label {
    font-family: 'Orbitron', sans-serif;
    font-size: 7.5px;
    color: #b0b7c3;
    margin-bottom: 5px;
    letter-spacing: 0.4px;
  }

  .pass-input {
    width: 100%;
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid #322c3d;
    background: #1c1824;
    color: #fff;
    font-family: 'Rubik', sans-serif;
    font-size: 9px;
    text-align: center;
    outline: none;
    margin-bottom: 5px;
  }

  .login-btn {
    width: 100%;
    padding: 6px;
    border: none;
    border-radius: 6px;
    background: linear-gradient(90deg, #ff3377, #ff6633, #00e676);
    background-size: 250% 250%;
    animation: rgbFlow 3s ease infinite;
    color: #fff;
    font-family: 'Orbitron', sans-serif;
    font-size: 8.5px;
    font-weight: 800;
    cursor: pointer;
    letter-spacing: 0.5px;
  }

  .error-msg {
    color: #ff5277;
    font-size: 7.5px;
    margin-top: 4px;
    display: none;
  }

  /* Main Predictor View */
  #predictor-view {
    display: none;
  }

  /* Market Tabs */
  .tabs-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 3.5px;
    margin-bottom: 5px;
  }

  .tab-btn {
    background: #1d1a24;
    border: 1px solid #2e2938;
    color: #9e9aa8;
    font-family: 'Orbitron', sans-serif;
    font-size: 7.5px;
    font-weight: 700;
    padding: 4px 0;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .tab-btn.active {
    background: linear-gradient(90deg, #ff3d7f, #ff6a5c);
    color: #ffffff;
    border-color: transparent;
    box-shadow: 0 0 8px rgba(255, 61, 127, 0.45);
  }

  /* Middle Grid: Image + Period/Next Round */
  .middle-grid {
    display: grid;
    grid-template-columns: 46px 1fr;
    gap: 5px;
    align-items: center;
    margin-bottom: 5px;
  }

  .profile-box {
    width: 46px;
    height: 46px;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid #352f42;
  }

  .profile-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .period-timer-box {
    background: #1b1822;
    border: 1px solid #2a2534;
    border-radius: 8px;
    padding: 4px 6px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .info-line {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 4px;
  }

  .info-label {
    font-family: 'Orbitron', sans-serif;
    font-size: 6px;
    font-weight: 700;
    color: #a19ca9;
    display: flex;
    align-items: center;
    gap: 3px;
    letter-spacing: 0.3px;
    white-space: nowrap;
  }

  .dot-live {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #ff4d8d;
    display: inline-block;
  }

  .period-val {
    font-family: 'Rubik', sans-serif;
    font-size: 7.2px;
    font-weight: 700;
    color: #e6e1ee;
    letter-spacing: 0.2px;
  }

  .timer-val {
    font-family: 'Rubik', sans-serif;
    font-size: 8.5px;
    font-weight: 800;
    color: #ff4d8d;
  }

  /* Signal Box & Scalloped Orbs */
  .signal-row {
    display: grid;
    grid-template-columns: 1fr 42px;
    gap: 5px;
    align-items: stretch;
    margin-bottom: 5px;
  }

  .signal-card {
    background: #1b1822;
    border: 1px solid #2b2636;
    border-radius: 9px;
    padding: 6px 4px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }

  .signal-sub {
    font-family: 'Orbitron', sans-serif;
    font-size: 6px;
    font-weight: 700;
    color: #9e99a8;
    letter-spacing: 0.4px;
    margin-bottom: 2px;
  }

  .signal-main {
    font-family: 'Orbitron', sans-serif;
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 0.8px;
    color: #ff4d8d;
  }

  .signal-card.small-mode .signal-main {
    color: #00e676;
  }

  .orbs-col {
    background: #1b1822;
    border: 1px solid #2a2534;
    border-radius: 9px;
    padding: 4px 0;
    display: flex;
    flex-direction: column;
    justify-content: space-around;
    align-items: center;
    gap: 3px;
  }

  .wavy-orb {
    width: 21px;
    height: 21px;
    border-radius: 50%;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .wavy-orb.green-orb {
    background: radial-gradient(circle, #15803d 55%, #052e16 100%);
    border: 1px solid #22c55e;
  }

  .wavy-orb.red-orb {
    background: radial-gradient(circle, #be123c 55%, #4c0519 100%);
    border: 1px solid #f43f5e;
  }

  .wavy-orb svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .orb-num {
    position: relative;
    z-index: 2;
    width: 11px;
    height: 11px;
    background: #ffffff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Rubik', sans-serif;
    font-size: 7px;
    font-weight: 800;
    color: #111827;
    line-height: 1;
  }

  /* Telegram Button (Icon + JOIN TG only) */
  .tg-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    width: 100%;
    padding: 5.5px 8px;
    border-radius: 7px;
    text-decoration: none;
    background: linear-gradient(90deg, #ff3d7f, #ff6a5c);
    color: #ffffff;
    font-family: 'Orbitron', sans-serif;
    font-size: 8px;
    font-weight: 800;
    letter-spacing: 0.5px;
    box-shadow: 0 2px 8px rgba(255, 61, 127, 0.35);
  }

  .tg-icon {
    width: 10px;
    height: 10px;
    fill: #ffffff;
    flex-shrink: 0;
  }

  /* Minimized Floating Icon */
  #minimized-icon {
    display: none;
    position: fixed;
    top: 120px;
    left: 20px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    padding: 2px;
    background: linear-gradient(45deg, #ff2a85, #00e676, #00b0ff);
    background-size: 300% 300%;
    animation: rgbFlow 3s ease infinite, rgbGlow 3s ease infinite;
    z-index: 9999;
    cursor: pointer;
    touch-action: none;
  }

  #minimized-icon img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
  }
</style>
</head>

<script>
  const CORRECT_PASS = "patowari-69";
  const loginBtn = document.getElementById("login-btn");
  const passInput = document.getElementById("pass-input");
  const errorMsg = document.getElementById("error-msg");
  const loginView = document.getElementById("login-view");
  const predictorView = document.getElementById("predictor-view");

  function checkLogin() {
    if (passInput.value.trim() === CORRECT_PASS) {
      loginView.style.display = "none";
      predictorView.style.display = "block";
      updateClock();
    } else {
      errorMsg.style.display = "block";
    }
  }

  loginBtn.addEventListener("click", checkLogin);
  passInput.addEventListener("keypress", (e) => {
    if (e.key === "Enter") checkLogin();
  });

  let currentSec = 30;
  let currentCode = "10005";
  let lastPeriod = "";

  const tabBtns = document.querySelectorAll(".tab-btn");
  const periodDisplay = document.getElementById("period-display");
  const timerDisplay = document.getElementById("timer-display");
  const marketLabel = document.getElementById("market-label");
  const signalBox = document.getElementById("signal-box");
  const signalText = document.getElementById("signal-text");
  const orb1 = document.getElementById("orb-1");
  const orb2 = document.getElementById("orb-2");
  const num1 = document.getElementById("num-1");
  const num2 = document.getElementById("num-2");

  tabBtns.forEach(btn => {
    btn.addEventListener("click", () => {
      tabBtns.forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentSec = parseInt(btn.getAttribute("data-sec"));
      currentCode = btn.getAttribute("data-code");
      marketLabel.textContent = `AI (${btn.textContent} MARKET)`;
      lastPeriod = "";
      updateClock();
    });
  });

  function generateSignalForPeriod(periodStr) {
    let hash = 0;
    for (let i = 0; i < periodStr.length; i++) {
      hash = ((hash << 5) - hash) + periodStr.charCodeAt(i);
      hash |= 0;
    }
    const absHash = Math.abs(hash);
    const isBig = (absHash % 2) === 0;

    if (isBig) {
      signalBox.classList.remove("small-mode");
      signalText.textContent = "BIG";
      const bigNums = [5, 6, 7, 8, 9];
      setOrbStyle(orb1, num1, bigNums[absHash % 5]);
      setOrbStyle(orb2, num2, bigNums[(absHash + 2) % 5]);
    } else {
      signalBox.classList.add("small-mode");
      signalText.textContent = "SMALL";
      const smallNums = [0, 1, 2, 3, 4];
      setOrbStyle(orb1, num1, smallNums[absHash % 5]);
      setOrbStyle(orb2, num2, smallNums[(absHash + 3) % 5]);
    }
  }

  function setOrbStyle(orbEl, numEl, digit) {
    numEl.textContent = digit;
    const isGreen = [1, 3, 5, 7, 9].includes(digit);
    orbEl.className = "wavy-orb " + (isGreen ? "green-orb" : "red-orb");
  }

  function updateClock() {
    const now = new Date();
    const utcYear = now.getUTCFullYear();
    const utcMonth = String(now.getUTCMonth() + 1).padStart(2, '0');
    const utcDay = String(now.getUTCDate()).padStart(2, '0');
    const datePrefix = `${utcYear}${utcMonth}${utcDay}`;

    const totalSecToday = (now.getUTCHours() * 3600) + (now.getUTCMinutes() * 60) + now.getUTCSeconds();
    const roundNumber = Math.floor(totalSecToday / currentSec) + 1;
    const remainingSec = currentSec - (totalSecToday % currentSec);

    const periodStr = `${datePrefix}${currentCode}${String(roundNumber).padStart(4, '0')}`;
    periodDisplay.textContent = periodStr;
    timerDisplay.textContent = `${String(remainingSec).padStart(3, '0')}s`;

    if (periodStr !== lastPeriod) {
      lastPeriod = periodStr;
      generateSignalForPeriod(periodStr);
    }
  }

  setInterval(updateClock, 1000);
  updateClock();

  const wrapper = document.getElementById("predictor-wrapper");
  const minBtn = document.getElementById("minimize-btn");
  const minIcon = document.getElementById("minimized-icon");

  minBtn.addEventListener("click", () => {
    wrapper.style.display = "none";
    minIcon.style.display = "block";
  });

  function makeDraggable(el, handle) {
    let isDragging = false;
    let startX, startY, initialLeft, initialTop;
    let moved = false;

    const onStart = (e) => {
      isDragging = true;
      moved = false;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      startX = clientX;
      startY = clientY;
      const rect = el.getBoundingClientRect();
      initialLeft = rect.left;
      initialTop = rect.top;
    };

    const onMove = (e) => {
      if (!isDragging) return;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const dx = clientX - startX;
      const dy = clientY - startY;
      if (Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;
      el.style.left = `${initialLeft + dx}px`;
      el.style.top = `${initialTop + dy}px`;
    };

    const onEnd = () => {
      if (isDragging && !moved && el === minIcon) {
        minIcon.style.display = "none";
        wrapper.style.display = "block";
      }
      isDragging = false;
    };

    handle.addEventListener("mousedown", onStart);
    handle.addEventListener("touchstart", onStart, { passive: true });
    window.addEventListener("mousemove", onMove);
    window.addEventListener("touchmove", onMove, { passive: true });
    window.addEventListener("mouseup", onEnd);
    window.addEventListener("touchend", onEnd);
  }

  makeDraggable(wrapper, document.getElementById("drag-handle"));
  makeDraggable(minIcon, minIcon);
</script>
