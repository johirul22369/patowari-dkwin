<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  body, html {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #0b0e14;
    font-family: 'Poppins', sans-serif;
  }

  /* Background Iframe */
  #game-frame {
    width: 100%;
    height: 100%;
    border: none;
    position: fixed;
    top: 0;
    left: 0;
    z-index: 1;
  }

  /* RGB Keyframes */
  @keyframes rgbFlow {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  @keyframes rgbGlow {
    0% { box-shadow: 0 0 15px rgba(255, 0, 85, 0.7), 0 0 30px rgba(0, 240, 255, 0.4); }
    33% { box-shadow: 0 0 15px rgba(0, 255, 136, 0.7), 0 0 30px rgba(255, 0, 221, 0.4); }
    66% { box-shadow: 0 0 15px rgba(0, 170, 255, 0.7), 0 0 30px rgba(255, 215, 0, 0.4); }
    100% { box-shadow: 0 0 15px rgba(255, 0, 85, 0.7), 0 0 30px rgba(0, 240, 255, 0.4); }
  }

  /* Floating Overlay Container */
  #predictor-wrapper {
    position: fixed;
    top: 25px;
    left: 15px;
    width: 310px;
    z-index: 9999;
    touch-action: none;
  }

  /* Outer RGB Border Card */
  .rgb-border-box {
    position: relative;
    padding: 3px;
    border-radius: 18px;
    background: linear-gradient(45deg, #ff0055, #ffcc00, #00ff88, #00d4ff, #aa00ff, #ff0055);
    background-size: 400% 400%;
    animation: rgbFlow 4s ease infinite, rgbGlow 4s ease infinite;
  }

  .panel-inner {
    background: #10131a;
    border-radius: 15px;
    padding: 8px 10px 10px 10px;
    color: #fff;
    position: relative;
    overflow: hidden;
  }

  /* Top & Bottom Ticker Bar */
  .ticker-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: 'Orbitron', sans-serif;
    font-size: 9px;
    font-weight: 700;
    color: #00ff88;
    letter-spacing: 1px;
    padding: 2px 6px;
    text-shadow: 0 0 6px rgba(0, 255, 136, 0.6);
  }

  .ticker-bar span {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  /* Header Bar */
  .header-bar {

    justify-content: space-between;
    align-items: center;

    border: 1px solid #2a3040;
    border-radius: 10px;
    padding: 6px 10px;
    margin: 4px 0 8px 0;
    cursor: grab;
  }

  .header-bar:active {

  .header-title {

    -webkit-text-fill-color: transparent;

  }

  .close-btn {

    height: 22px;

    background: rgba(255, 51, 102, 0.15);
    border: 1px solid #ff3366;
    color: #ff3366;
    font-size: 12px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: 0.2s;
  }

  .close-btn:hover {

  }

  /* Login Section */

    touch-action: none;
  }

  #minimized-icon img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
  }
</style>

<script>
  // Password Authentication
  const CORRECT_PASS = "patowari-69";
  const loginBtn = document.getElementById("login-btn");
  const passInput = document.getElementById("pass-input");
  const errorMsg = document.getElementById("error-msg");
  const loginView = document.getElementById("login-view");
  const predictorView = document.getElementById("predictor-view");

  function checkLogin() {
    if (passInput.value.trim() === CORRECT_PASS) {
      loginView.style.display = "none";
      predictorView.style.display = "block";
      updatePrediction();
    } else {
      errorMsg.style.display = "block";
    }
  }

  loginBtn.addEventListener("click", checkLogin);
  passInput.addEventListener("keypress", (e) => {
    if (e.key === "Enter") checkLogin();
  });

  // Market State & Synchronized Wingo Period Calculation
  let currentSec = 30;
  let currentCode = "10005";
  let lastPeriod = "";

  const tabBtns = document.querySelectorAll(".tab-btn");
  const periodDisplay = document.getElementById("period-display");
  const timerDisplay = document.getElementById("timer-display");
  const marketLabel = document.getElementById("market-label");
  const signalBox = document.getElementById("signal-box");
  const signalText = document.getElementById("signal-text");
  const orb1 = document.getElementById("orb-1");
  const orb2 = document.getElementById("orb-2");
  const num1 = document.getElementById("num-1");
  const num2 = document.getElementById("num-2");

  tabBtns.forEach(btn => {
    btn.addEventListener("click", () => {
      tabBtns.forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentSec = parseInt(btn.getAttribute("data-sec"));
      currentCode = btn.getAttribute("data-code");
      marketLabel.textContent = `AI (${btn.textContent} MARKET)`;
      lastPeriod = ""; // Force instant refresh on tab change
      updateClock();
    });
  });

  // Deterministic Hash Signal Generator per Period
  function generateSignalForPeriod(periodStr) {
    let hash = 0;
    for (let i = 0; i < periodStr.length; i++) {
      hash = ((hash << 5) - hash) + periodStr.charCodeAt(i);
      hash |= 0;
    }
    const absHash = Math.abs(hash);
    const isBig = (absHash % 2) === 1;

    if (isBig) {
      signalBox.classList.add("big-mode");
      signalText.textContent = "BIG";
      const bigNums = [5, 6, 7, 8, 9];
      const n1 = bigNums[absHash % 5];
      const n2 = bigNums[(absHash + 2) % 5];
      setOrbStyle(orb1, num1, n1);
      setOrbStyle(orb2, num2, n2);
    } else {
      signalBox.classList.remove("big-mode");
      signalText.textContent = "SMALL";
      const smallNums = [0, 1, 2, 3, 4];
      const n1 = smallNums[absHash % 5];
      const n2 = smallNums[(absHash + 3) % 5];
      setOrbStyle(orb1, num1, n1);
      setOrbStyle(orb2, num2, n2);
    }
  }

  function setOrbStyle(orbEl, numEl, digit) {
    numEl.textContent = digit;
    // Wingo standard: 1,3,7,9,5 = Green | 0,2,4,6,8 = Red
    const isGreen = [1, 3, 5, 7, 9].includes(digit);
    orbEl.className = "wavy-orb " + (isGreen ? "green-orb" : "red-orb");
  }

  function updateClock() {
    // Sync to UTC+5:30 / Standard Wingo Server Time (UTC+0 or UTC+6 aligned)
    const now = new Date();
    // Standard Wingo period resets daily at 00:00 UTC+0 (or UTC+5:30 depending on server; DKWin uses UTC+0 date + round index)
    const utcYear = now.getUTCFullYear();
    const utcMonth = String(now.getUTCMonth() + 1).padStart(2, '0');
    const utcDay = String(now.getUTCDate()).padStart(2, '0');
    const datePrefix = `${utcYear}${utcMonth}${utcDay}`;

    const totalSecToday = (now.getUTCHours() * 3600) + (now.getUTCMinutes() * 60) + now.getUTCSeconds();
    const roundNumber = Math.floor(totalSecToday / currentSec) + 1;
    const remainingSec = currentSec - (totalSecToday % currentSec);

    const periodStr = `${datePrefix}${currentCode}${String(roundNumber).padStart(4, '0')}`;
    periodDisplay.textContent = periodStr;
    timerDisplay.textContent = `${String(remainingSec).padStart(3, '0')}s`;

    if (periodStr !== lastPeriod) {
      lastPeriod = periodStr;
      generateSignalForPeriod(periodStr);
    }
  }

  function updatePrediction() {
    updateClock();
  }

  setInterval(updateClock, 1000);
  updateClock();

  // Minimize & Restore Logic
  const wrapper = document.getElementById("predictor-wrapper");
  const minBtn = document.getElementById("minimize-btn");
  const minIcon = document.getElementById("minimized-icon");

  minBtn.addEventListener("click", () => {
    wrapper.style.display = "none";
    minIcon.style.display = "block";
  });

  // Draggable Logic (Touch & Mouse)
  function makeDraggable(el, handle) {
    let isDragging = false;
    let startX, startY, initialLeft, initialTop;
    let moved = false;

    const onStart = (e) => {
      isDragging = true;
      moved = false;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      startX = clientX;
      startY = clientY;
      const rect = el.getBoundingClientRect();
      initialLeft = rect.left;
      initialTop = rect.top;
    };

    const onMove = (e) => {
      if (!isDragging) return;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const dx = clientX - startX;
      const dy = clientY - startY;
      if (Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;
      el.style.left = `${initialLeft + dx}px`;
      el.style.top = `${initialTop + dy}px`;
    };

    const onEnd = () => {
      if (isDragging && !moved && el === minIcon) {
        minIcon.style.display = "none";
        wrapper.style.display = "block";
      }
      isDragging = false;
    };

    handle.addEventListener("mousedown", onStart);
    handle.addEventListener("touchstart", onStart, { passive: true });
    window.addEventListener("mousemove", onMove);
    window.addEventListener("touchmove", onMove, { passive: true });
    window.addEventListener("mouseup", onEnd);
    window.addEventListener("touchend", onEnd);
  }

  makeDraggable(wrapper, document.getElementById("drag-handle"));
  makeDraggable(minIcon, minIcon);
</script>
</body>
</html>
